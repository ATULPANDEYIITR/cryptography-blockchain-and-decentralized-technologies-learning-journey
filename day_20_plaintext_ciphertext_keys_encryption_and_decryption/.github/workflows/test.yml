name: Test Day 20 Project

on:
  push:
    paths:
      - "day_20_plaintext_ciphertext_keys_encryption_and_decryption/**"
  pull_request:
    paths:
      - "day_20_plaintext_ciphertext_keys_encryption_and_decryption/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: day_20_plaintext_ciphertext_keys_encryption_and_decryption
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        working-directory: day_20_plaintext_ciphertext_keys_encryption_and_decryption
        run: python -m pytest tests -v

      - name: Build C++ demonstration
        working-directory: day_20_plaintext_ciphertext_keys_encryption_and_decryption
        run: g++ cpp/encryption_demo.cpp -o cpp/encryption_demo